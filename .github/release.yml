changelog:
  exclude:
    labels: [duplicate, invalid, wontfix]
  categories:
    - title: Breaking changes
      labels: [breaking-change]
    - title: Features and improvements
      labels: [enhancement]
    - title: Fixes
      labels: [bug]
    - title: Documentation
      labels: [documentation]
    - title: Dependencies and maintenance
      labels: [dependencies, maintenance]
    - title: Other changes
      labels: ["*"]
