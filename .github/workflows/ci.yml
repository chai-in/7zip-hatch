name: 7-Zip Hatch

on:
  push:
    branches: [main, hatchzip-integration]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hatch-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.changes.outputs.code }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select native checks conservatively
        id: changes
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD: ${{ github.sha }}
        run: python3 Hatch/ci_changes.py

  build-test:
    name: ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/build/hatch-target
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev
      - name: Install pinned Rust tools
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - name: Cache verified Cargo downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ runner.arch }}-1.95-${{ hashFiles('third_party/hatchzip/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-1.95-
      - name: Desktop packaging regression checks
        run: python Hatch/test_packaging.py
      - name: Format
        working-directory: third_party/hatchzip
        run: cargo fmt --all --check
      - name: Clippy
        working-directory: third_party/hatchzip
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Build embedded executable (Unix)
        if: runner.os != 'Windows'
        run: python3 Hatch/build.py --debug --jobs 4
      - name: Build embedded executable (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          python Hatch/build.py --debug --jobs 4
      - name: Test combined executable (Unix)
        if: runner.os != 'Windows'
        run: python3 Hatch/test_integration.py build/debug/7zz --crash-tests
      - name: Test combined executable (Windows)
        if: runner.os == 'Windows'
        run: python Hatch/test_integration.py build/debug/7zz.exe --crash-tests
      - name: Upstream recovery suites through embedded executable
        shell: bash
        working-directory: third_party/hatchzip
        run: |
          if [ "$RUNNER_OS" = Windows ]; then suffix=.exe; else suffix=; fi
          export SEVENZIP_HATCH_BINARY="$GITHUB_WORKSPACE/build/debug/7zz$suffix"
          export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/build/hatch-target"
          cargo test --locked --workspace
      - name: Build release (Unix)
        if: runner.os != 'Windows'
        run: python3 Hatch/build.py --jobs 4
      - name: Build release (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          python Hatch/build.py --jobs 4
      - name: Test release (Unix)
        if: runner.os != 'Windows'
        run: python3 Hatch/test_integration.py build/release/7zz
      - name: Test release (Windows)
        if: runner.os == 'Windows'
        run: python Hatch/test_integration.py build/release/7zz.exe
      - name: Build desktop (Unix)
        if: runner.os != 'Windows'
        run: python3 Hatch/build_desktop.py --skip-engine --jobs 4
      - name: Build desktop and Windows File Manager
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          python Hatch/build_desktop.py --skip-engine --jobs 4
      - name: Package desktop
        run: python Hatch/package_desktop.py
      - name: Upload desktop
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: 7zip-hatch-${{ runner.os }}-${{ runner.arch }}
          path: build/packages/*
          if-no-files-found: error

  windows-file-manager:
    name: Windows File Manager
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Compile native File Manager with the Hatch menu
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          cd CPP\7zip\Bundles\Fm
          nmake /nologo /f makefile PLATFORM=x64 O=hatch-desktop-x64-ci DISABLE_RAR_COMPRESS=1

  complete:
    name: CI
    needs: [changes, build-test, windows-file-manager]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every selected check
        env:
          SELECTION: ${{ needs.changes.result }}
          NATIVE: ${{ needs.changes.outputs.code }}
          BUILDS: ${{ needs.build-test.result }}
          FILE_MANAGER: ${{ needs.windows-file-manager.result }}
        run: |
          python3 - <<'PY'
          import os
          assert os.environ['SELECTION'] == 'success', 'Check selection failed'
          expected = 'success' if os.environ['NATIVE'] == 'true' else 'skipped'
          assert os.environ['BUILDS'] == expected, 'A selected native build failed or was cancelled'
          assert os.environ['FILE_MANAGER'] == expected, 'The File Manager build failed or was cancelled'
          print('All selected checks passed; documentation uses the repository checks.')
          PY
