name: CodeQL

on:
  push:
    branches: [main]
    paths: ["C/**", "CPP/**", "Hatch/**/*.py", "third_party/hatchzip/**", ".github/workflows/**"]
  pull_request:
    paths: ["C/**", "CPP/**", "Hatch/**/*.py", "third_party/hatchzip/**", ".github/workflows/**"]
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, c-cpp, python, rust]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Rust extraction dependencies
        if: matrix.language == 'rust'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev
          rustup toolchain install 1.95.0 --profile minimal
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          source-root: ${{ matrix.language == 'rust' && 'third_party/hatchzip' || '.' }}
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: /language:${{ matrix.language }}
