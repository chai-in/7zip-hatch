name: Desktop installers

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Hatch/installers/**
      - Hatch/prepare_installer_payload.py
      - .github/workflows/installers.yml
  pull_request:
    paths:
      - Hatch/installers/**
      - Hatch/prepare_installer_payload.py
      - .github/workflows/installers.yml

permissions:
  contents: read

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows setup install and uninstall
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Download and verify tested desktop payload
        run: |
          python Hatch/installers/test_payload.py
          python Hatch/prepare_installer_payload.py windows
      - name: Build per-user setup executable
        run: Hatch/installers/windows/build_setup.ps1 build/installers/payload/7zip-hatch
      - name: Install, run both GUIs, test engines, reinstall and uninstall
        run: Hatch/installers/windows/test_setup.ps1 build/packages/7zip-hatch-0.2.0-windows-x64-setup.exe build/installers/payload/7zip-hatch
      - name: Upload tested installer
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: 7zip-hatch-Windows-setup
          path: build/packages/*-setup.exe
          if-no-files-found: error

  linux:
    name: Linux AppImage build and desktop smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Packaging and graphical test dependencies
        run: |
          sudo sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils patchelf xvfb openbox xdotool wmctrl imagemagick
          # Align bundled libraries with the current source repositories. The
          # runner image can contain superseded builds whose sources moved.
          sudo apt-get install -y libfontconfig1 libfreetype6 libexpat1 zlib1g libstdc++6 libgcc-s1 libbz2-1.0 libpng16-16t64 libbrotli1 libffi8 libxcb-xkb1 libxkbcommon0 libxkbcommon-x11-0 libwayland-client0 libwayland-cursor0 libwayland-egl1
      - name: Download and verify tested desktop payload
        run: |
          python3 Hatch/installers/test_payload.py
          python3 Hatch/prepare_installer_payload.py linux
      - name: Build AppImage and corresponding library source bundle
        run: bash Hatch/installers/linux/build_appimage.sh build/installers/payload/7zip-hatch
      - name: Test AppImage runtime, engines, menus and real desktop window
        run: |
          xvfb-run -a sh -c 'openbox >/tmp/openbox.log 2>&1 & python3 Hatch/installers/linux/test_appimage.py build/packages/7zip-hatch-0.2.0-linux-x86_64.AppImage build/installers/payload/7zip-hatch'
      - name: Upload tested AppImage and source bundle
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: 7zip-hatch-Linux-AppImage
          path: build/packages/*
          if-no-files-found: error
