[package]
name = "hatchzip-gui"
description = "7-Zip Hatch desktop: create, browse, and extract archives with optional space reclamation."
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository = "https://github.com/chai-in/7zip-hatch"
homepage = "https://github.com/chai-in/7zip-hatch"
publish = false

[dependencies]
hatchzip-core.workspace = true
hatchzip-shell = { path = "../shell" }
anyhow.workspace = true
clap = { version = "4", features = ["derive"] }
open = "5.4.5"
# Decodes the window icon; already in the tree through Slint's build.
png = "0.18.1"
rfd = "0.17.2"
serde.workspace = true
serde_json.workspace = true
fs4 = "1.1.0"
tempfile.workspace = true
# No Qt backend: winit with FemtoVG (OpenGL) first and the software renderer
# as the fallback for machines without a working GPU driver. `~1.18` because
# `unstable-winit-030`, needed for files dropped on the window, may change in
# any minor release.
slint = { version = "~1.18.1", default-features = false, features = [
    "std",
    "compat-1-2",
    "accessibility",
    "backend-winit",
    "renderer-femtovg",
    "renderer-software",
    "software-renderer-path",
    "raw-window-handle-06",
    "unstable-winit-030",
] }

[build-dependencies]
slint-build = "~1.18.1"
# Only used when the target is Windows; see build.rs.
winresource = { version = "0.1.34", default-features = false }

[dev-dependencies]
# Drives the real windows headlessly, drawn by the software renderer. Must
# match the version `slint` pins its internals to.
i-slint-backend-testing = { version = "=1.18.1", features = ["renderer-software"] }
tempfile.workspace = true
zip.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", features = ["NSAppleEventDescriptor", "NSAppleEventManager", "NSURL", "objc2-core-services"] }
