<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="640" viewBox="0 0 1280 640">
  <title>7-Zip Hatch: standard archives, less extraction space</title>
  <desc>Free software desktop archiver for Windows, macOS and Linux. Independent 7-Zip and HatchZip fork. Desktop preview.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111c2c"/><stop offset="1" stop-color="#0b1220"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#194e71" stop-opacity=".65"/><stop offset="1" stop-color="#194e71" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="1060" cy="280" r="390" fill="url(#glow)"/>
  <rect x="44" y="44" width="1192" height="552" rx="24" fill="none" stroke="#2b3d52"/>
  <rect x="88" y="84" width="306" height="34" rx="17" fill="#183b38"/>
  <text x="108" y="107" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5" fill="#8ed9be">FREE SOFTWARE / PREVIEW</text>
  <text x="88" y="211" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="700" letter-spacing="-2" fill="#f4f7fc">7-Zip Hatch</text>
  <text x="90" y="294" font-family="Arial, Helvetica, sans-serif" font-size="40" fill="#e0e9f5">Standard archives.</text>
  <text x="90" y="348" font-family="Arial, Helvetica, sans-serif" font-size="40" fill="#8bd2ee">Less extraction space.</text>
  <text x="90" y="408" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#aab9ce">Create, browse, and extract with 7-Zip + HatchZip.</text>
  <image x="880" y="135" width="270" height="270" xlink:href="data:image/png;base64,"/>
  <path d="M88 468H1192" stroke="#2b3d52"/>
  <text x="90" y="521" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#e0e9f5">Windows  /  macOS  /  Linux</text>
  <text x="90" y="558" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#91a6bf">github.com/chai-in/7zip-hatch</text>
  <text x="1190" y="557" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#91a6bf">Independent fork. Standard formats.</text>
</svg>
